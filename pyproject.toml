[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-robot"
version = "0.0.1"
description = "A physics firewall that simulates every action an LLM-driven robot proposes and blocks the unsafe ones."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mink>=1.4",
    "mujoco>=3.3",
    "numpy",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2"]
video = ["imageio>=2.30", "imageio-ffmpeg>=0.5"]

[project.scripts]
preflight = "preflight.cli:app"

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
